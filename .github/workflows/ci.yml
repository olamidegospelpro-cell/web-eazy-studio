name: WebEazy CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The project was moved from Vite 8/Rolldown to Vite 7 for legacy-CPU
      # development compatibility. Let Bun reconcile the existing lockfile
      # during CI until the dependency graph is intentionally re-locked.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
