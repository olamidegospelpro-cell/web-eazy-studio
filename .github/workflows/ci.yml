name: Verify WebEazy

on:
  push:
    branches:
      - main
      - develop
      - feature/webeazy-v1-foundation
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify lockfile is present
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
